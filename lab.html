
<!DOCTYPE html>
<html>
<head>
    <title>Registration Login</title>
</head>
<body>
    <h2>Signup</h2>

    <form id="signup">
        <input id="email" type="email" placeholder="Email" required>
        <br>
        <input id="password" type="password" placeholder="Password" required>
        <br>
        <button>Signup</button>
    </form>

    <h2>Login</h2>

    <form id="login">
        <input id="email" type="email" placeholder="Email" required>
        <br>
        <input id="password" type="password" placeholder="Password" required>
        <br>
        <button>Login</button>
    </form>

   

</body>
</html>
